# Avisa de versiones nuevas de dependencias y de las acciones del CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Un solo PR por semana con las actualizaciones menores y de parche.
      menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
